footer{text-align:center;color:var(--sub);font-size:12.5px;padding:0 24px 40px}

function card(x,cls){
 return `<a class="card" href="${esc(x.u)}" target="_blank" rel="noopener">${ico(x)}
 <div class="body"><div class="nm">${esc(x.n)}</div>
 <div class="ur ${cls==='o'?'':'g'}">${esc(x.u.replace(/^https?:\/\//,'').replace(/\/$/,''))}</div>

 </div></a>`;}
