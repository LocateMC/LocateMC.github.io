const grid=document.getElementById('grid'),q=document.getElementById('q'),
      chips=document.getElementById('chips'),count=document.getElementById('count'),
      empty=document.getElementById('empty');
let cur='全部';
document.getElementById('total').textContent=DATA.length;
document.getElementById('total2').textContent=DATA.length;
document.getElementById('ncats').textContent=CATS.length;
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chipEl(c,n){const b=document.createElement('button');b.className='chip'+(c===cur?' on':'');
 b.textContent=c+(n!==undefined?' · '+n:'');b.onclick=()=>{cur=c;render();};return b;}
chips.appendChild(chipEl('全部',DATA.length));
CATS.forEach(c=>chips.appendChild(chipEl(c,DATA.filter(x=>x.m===c).length)));
function render(){
 [...chips.children].forEach((b,i)=>b.classList.toggle('on',b.textContent.split(' · ')[0]===cur));
 const k=q.value.trim().toLowerCase();
 const list=DATA.filter(x=>{
   const okc=cur==='全部'||x.m===cur;
   if(!okc)return false;
   if(!k)return true;
   return (x.n+' '+x.u+' '+x.d+' '+x.c.join(' ')).toLowerCase().includes(k);
 });
 count.textContent=`显示 ${list.length} / ${DATA.length}`;
 empty.style.display=list.length?'none':'block';
 grid.innerHTML=list.map(x=>{
  const ini=esc(x.n.trim()[0]||'?');
  const ico=x.i?`<div class="ico"><img src="${esc(x.i)}" alt="" onerror="this.parentNode.textContent='${ini}'"></div>`
               :`<div class="ico">${ini}</div>`;
  return `<a class="card" href="${esc(x.u)}" target="_blank" rel="noopener">
    ${ico}<div class="body">
    <div class="nm">${esc(x.n)}</div>
    <div class="ur">${esc(x.u.replace(/^https?:\/\//,'').replace(/\/$/,''))}</div>
    <div class="ds">${esc(x.d)}</div>
    <div class="tags">${x.c.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div>
   </div></a>`;}).join('');
}
q.addEventListener('input',render);
render();
