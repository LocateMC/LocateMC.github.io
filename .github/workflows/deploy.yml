# GitHub Pages 自动部署（LocateMC 公开静态版）
# 触发：push 到 master（如新建仓库默认分支是 main，请把下方 branches 里的 master 改为 main）
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, upload
        uses: withastro/action@v6
        # 自动根据 package-lock.json 识别 npm；如需指定 Node 版本可放开下行
        # with:
        #   node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
