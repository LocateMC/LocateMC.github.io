// src/components/CardDetailModal.astro
import { getCollection } from 'astro:content';

const allNavEntries = await getCollection('nav');

// 创建“干净”的可序列化数组，防止JSON解析问题，这仍然是最佳实践
const serializableEntries = allNavEntries.map(entry => ({
  id: entry.id,
  body: entry.body,
  data: {
    title: entry.data.title,
    description: entry.data.description,
    href: entry.data.href,
    icon: entry.data.icon,
  },
}));
---

<!-- HTML 结构部分保持不变 -->
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div id="modal-panel" class="modal-panel">
    <button id="modal-close-btn" class="modal-close-btn" aria-label="关闭">×</button>
    <div id="modal-content" class="modal-content"></div>
  </div>
</div>

<!-- 
  【最终修复方案】
  我们只使用这一个 <script> 标签。
  - 它没有 `type="module"`，是一个普通的脚本。
  - 它使用 define:vars 将数据安全地注入。
  - 它会在需要时，动态地从CDN加载 marked 库。
-->
<script define:vars={{ navData: serializableEntries }}>
  // 1. 获取所有必要的 DOM 元素
  const backdrop = document.getElementById('modal-backdrop');
  const contentEl = document.getElementById('modal-content');
  const closeBtn = document.getElementById('modal-close-btn');
  
  // 2. 从 define:vars 获取数据，无需 JSON.parse
  const allNavEntries = navData;
  
  // 3. 定义一个变量来缓存加载过的 marked 库
  let markedInstance = null;

  // 4. 定义关闭函数
  function closeModal() {
    backdrop.classList.add('hidden');
  }

  // 5. 监听全局的 'open-modal' 事件，函数设为 async 以便使用 await
  window.addEventListener('open-modal', async (event) => {
    try {
      // 确保 marked 库已经被加载
      if (!markedInstance) {
        // 从可靠的 CDN 动态导入 marked 库
        // `window.marked` 是这个库加载后挂载到全局的变量名
        await import('https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js');
        markedInstance = window.marked;
      }

      // 获取条目数据
      const { entryId } = event.detail;
      const entry = allNavEntries.find((e) => e.id === entryId);

      if (!entry) {
        console.error('Modal Error: Could not find entry with id:', entryId);
        return;
      }
      
      // 使用加载好的 marked 实例来解析 Markdown
      const renderedHTML = markedInstance.parse(entry.body);

      // 填充 HTML 内容
      contentEl.innerHTML = `
        <div class="modal-grid">
          <div class="modal-sidebar">
            <img src="${entry.data.icon}" alt="${entry.data.title}" class="modal-icon" />
          </div>
          <div class="modal-main-info">
            <h2 class="modal-title">${entry.data.title}</h2>
            <p class="modal-description">${entry.data.description}</p>
            <div class="modal-buttons">
              <a href="${entry.data.href}" target="_blank" rel="noopener noreferrer" class="modal-button primary">
                前往网站 >
              </a>
              <button class="modal-button" id="qr-code-btn">二维码呈现</button>
            </div>
          </div>
        </div>
        <div class="modal-body">
          ${renderedHTML}
        </div>
      `;
      
      // 显示模态框
      backdrop.classList.remove('hidden');

    } catch (err) {
      console.error('Error opening modal:', err);
    }
  });

  // 6. 绑定关闭事件
  if(closeBtn && backdrop) {
    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) closeModal();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !backdrop.classList.contains('hidden')) {
        closeModal();
      }
    });
  }
</script>


<!-- 
  SECTION 3: CSS 样式
  包含了您期望的、最终版的模态框布局和样式。
-->
<style>
  .modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(18, 18, 18, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    opacity: 1;
    transition: opacity 0.25s ease;
  }
  .modal-backdrop.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .modal-panel {
    background-color: white;
    border-radius: 12px;
    padding: 28px 32px;
    width: 90%;
    max-width: 700px;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    transform: scale(1);
    transition: transform 0.25s ease;
  }
  .modal-backdrop.hidden .modal-panel {
    transform: scale(0.95);
  }
  .modal-close-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: transparent;
    border: none;
    font-size: 2rem;
    cursor: pointer;
    color: #a0a0a0;
  }

  /* 模态框内部网格布局 */
  .modal-grid {
    display: flex;
    gap: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid #eee;
    margin-bottom: 20px;
  }
  .modal-sidebar {
    flex-shrink: 0;
  }
  .modal-main-info {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
  }
  .modal-icon {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    object-fit: cover;
  }
  .modal-title {
    margin: 0 0 4px;
    font-size: 1.6rem;
    font-weight: 700;
    color: #111;
  }
  .modal-description {
    margin: 0;
    font-size: 1rem;
    color: #666;
    margin-bottom: auto; /* 让描述和按钮之间的空间自动撑开 */
  }

  /* 按钮容器和样式 */
  .modal-buttons {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }
  .modal-button {
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .modal-button.primary {
    background-color: #f0f0f0;
    color: #333;
  }
  .modal-button.primary:hover {
    background-color: #e5e5e5;
  }
  .modal-button:not(.primary) {
    background-color: transparent;
    color: #666;
  }
  .modal-button:not(.primary):hover {
    background-color: #f0f0f0;
  }
  
  /* 详细描述区域的样式 */
  .modal-body {
    color: #333;
    line-height: 1.7;
  }
  /* 让 marked 解析出的 HTML 元素有合适的间距 */
  .modal-body > *:first-child {
    margin-top: 0;
  }
  .modal-body h2 {
    font-size: 1.2rem;
    margin: 2em 0 0.8em;
  }
</style>


