---
// src/components/SideBar.astro
import { getCollection } from 'astro:content';

const allNavEntries = await getCollection('nav');

const groupedByCategory = allNavEntries.reduce((acc, entry) => {
  const { category, subcategory } = entry.data;
  if (!acc[category]) {
    acc[category] = { subcategories: {}, entriesWithoutSub: [] };
  }
  if (subcategory) {
    if (!acc[category].subcategories[subcategory]) {
      acc[category].subcategories[subcategory] = [];
    }
    acc[category].subcategories[subcategory].push(entry);
  } else {
    acc[category].entriesWithoutSub.push(entry);
  }
  return acc;
}, {});

const categoryOrder = { '官方': 1, '社区': 2, '百科': 3, '资源': 4, '在线工具': 5, '软件程序': 6, '工作室 & 组织': 7, '开发': 8, '收纳': 50 };
const sortedCategoryNames = Object.keys(groupedByCategory).sort((a, b) => (categoryOrder[a] || 999) - (categoryOrder[b] || 999));

const subcategoryOrder = {
  '资源': { '综合': 1, '地图、投影': 2, '模组、整合包': 3, '纹理、资源包、光影': 4 },
  '软件程序': { '启动器': 1, '版本库': 2, '实用工具（PC）': 3, '实用工具（Android）': 4, },
  '开发': { 'Java 模组': 1, 'Java 光影': 2, 'Java 服务端': 3, '基岩版': 4, }
};
---

<div class="sidebar-content">
  <header class="sidebar-header">
    <h1 class="logo">LocateMC</h1>
    <!-- 1. 将折叠按钮移到这里 -->
    <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <nav class="sidebar-nav">
    <ul>
      {sortedCategoryNames.map(categoryName => {
        const hasSubcategories = Object.keys(groupedByCategory[categoryName].subcategories).length > 0;
        return (
          <li>
            {hasSubcategories ? (
              // 2. 移除硬编码的 open 属性，使其默认收纳
              <details class="collapsible-menu">
                <summary class="menu-summary">
                  <a href={`#${categoryName}`}>{categoryName}</a>
                </summary>
                <div class="submenu-wrapper">
                  <ul class="submenu">
                    {Object.keys(groupedByCategory[categoryName].subcategories)
                      .sort((a, b) => {
                        const orderRules = subcategoryOrder[categoryName] || {};
                        const orderA = orderRules[a] || 999;
                        const orderB = orderRules[b] || 999;
                        return orderA - orderB;
                      })
                      .map(subcatName => (
                        <li><a href={`#${categoryName}-${subcatName}`}>{subcatName}</a></li>
                      ))
                    }
                  </ul>
                </div>
              </details>
            ) : (
              <a href={`#${categoryName}`}>{categoryName}</a>
            )}
          </li>
        );
      })}
    </ul>
  </nav>
</div>

<!-- 1. 将折叠逻辑的脚本移到这里 -->
<script>
  const toggleButton = document.getElementById('sidebar-toggle');
  const sidebar = document.querySelector('#sidebar'); 

  if (toggleButton && sidebar) {
    toggleButton.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });
  }
</script>

<style>
  .sidebar-content {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 1.5rem 0 24px;
    height: 80px;
    flex-shrink: 0;
    /* 1. 让头部和按钮跟随滚动 */
    position: sticky;
    top: 0;
    background-color: #f7f7f8;
    z-index: 10;
  }
  .logo { 
    font-size: 1.5rem; 
    font-weight: 700; 
    white-space: nowrap; 
    overflow: hidden;
    transition: opacity 0.3s, width 0.3s;
  }
  .sidebar-nav { 
    flex-grow: 1; 
    /* The parent .sidebar now handles scrolling */
  }
  
  /* 折叠按钮样式 */
  .sidebar-toggle {
    background: none; 
    border: 1px solid #ddd; 
    border-radius: 50%;
    width: 32px; 
    height: 32px; 
    flex-shrink: 0; 
    cursor: pointer;
    display: flex; 
    justify-content: center; 
    align-items: center;
    color: #666; 
    transition: transform 0.3s ease;
  }
  :global(.sidebar.collapsed) .sidebar-toggle {
    transform: rotate(180deg);
  }
  /* 折叠时隐藏Logo文字 */
  :global(.sidebar.collapsed) .logo {
    opacity: 0;
    width: 0;
    margin-left: -24px;
  }

  /* 菜单项样式 */
  nav ul { list-style: none; padding: 0 1rem; margin: 0; }
  nav a {
    display: block; padding: 0.75rem 1.5rem; text-decoration: none;
    color: #333; border-radius: 8px; font-weight: 500;
  }
  nav a:hover { background-color: #e9e9eb; }

  /* 4 & 5. 子菜单动画和对齐 */
  .collapsible-menu { transition: none; }
  .submenu-wrapper {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-in-out;
  }
  .collapsible-menu[open] .submenu-wrapper {
    max-height: 500px; /* 一个足够大的值，确保能完全展开 */
  }
  .submenu { 
    list-style: none; 
    padding: 0; 
    margin: 4px 0 8px; 
  }
  .submenu a {
    font-size: 0.9rem; 
    color: #555;
    padding-left: 2.5rem; /* 子分类缩进 */
  }
  
  .menu-summary {
    list-style: none; 
    display: flex; 
    align-items: center; 
    cursor: pointer;
  }
  .menu-summary::-webkit-details-marker { display: none; }
  .menu-summary::after {
    content: 'v'; 
    font-size: 1rem; 
    color: #888; 
    margin-left: auto;
    margin-right: 24px; 
    transform-origin: center; 
    transition: transform 0.2s ease-in-out;
    transform: rotate(-90deg); /* 默认箭头朝右 > */
  }
  .collapsible-menu[open] > .menu-summary::after {
    transform: rotate(0deg); /* 展开时箭头朝下 v */
  }
  .menu-summary > a { flex-grow: 1; }
</style>