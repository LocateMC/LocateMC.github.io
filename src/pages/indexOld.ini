---
// src/pages/index.astro
import AppLayout from '../layouts/AppLayout.astro';
import NavCard from '../components/NavCard.astro'; 
import SearchBar from '../components/SearchBar.astro';
import { getCollection } from 'astro:content';

// 1. 获取所有导航数据
const allNavEntries = await getCollection('nav');

// 2. 对所有卡片进行【内层排序】
const sortedNavEntries = allNavEntries.sort((a, b) => a.data.order - b.data.order);

// 3. 创建一个更通用的数据结构，用于处理子分类
const groupedData = sortedNavEntries.reduce((acc, entry) => {
  const { category, subcategory } = entry.data;

  // 初始化主分类
  if (!acc[category]) {
    acc[category] = { hasSubcategories: false, items: [], subcategories: {} };
  }

  // 如果有子分类，则放入 subcategories 对象中
  if (subcategory) {
    acc[category].hasSubcategories = true;
    if (!acc[category].subcategories[subcategory]) {
      acc[category].subcategories[subcategory] = [];
    }
    acc[category].subcategories[subcategory].push(entry);
  } else {
    // 如果没有子分类，则直接放入 items 数组
    acc[category].items.push(entry);
  }
  return acc;
}, {});

// 4. 定义【外层排序】的规则字典
const categoryOrder = { '官方': 1, '社区': 2, '百科': 3, '资源': 4, '在线工具': 5, '软件程序': 6, '工作室 & 组织': 7, '开发': 8, '收纳': 50 };
const sortedCategoryNames = Object.keys(groupedData).sort((a, b) => {
  const orderA = categoryOrder[a] || 999;
  const orderB = categoryOrder[b] || 999;
  return orderA - orderB;
});

// 5. 【核心新增】
//    创建一个专门用于“子分类”排序的规则字典。
//    您可以为每个主分类都定义一套独立的子分类顺序。
const subcategoryOrder = {
  '资源': {
    '综合': 1,
    '地图、投影': 2,
    '模组、整合包': 3,
    '纹理、资源包、光影': 4,
    '皮肤': 5,
    '付费': 6,
  },
  '软件程序': {
    '启动器': 1,
    '版本库': 2,
    '实用工具（PC）': 3,
    '实用工具（Android）': 4,
    // ...未来可以继续为“软件程序”添加新的子分类...
  },
  '开发': {
    'Java 模组': 1,
    'Java 光影': 2,
    'Java 服务端': 3,
    '基岩版': 4,
  }
  // ...未来可以为其他主分类定义子分类顺序...
};
---

<AppLayout title="LocateMC - 导航">
  <div class="page-container">
    
    <div class="placeholder-group-top">
      <div></div><div></div><div></div><div></div><div></div>
    </div>
    
    <div class="search-container">
      <SearchBar />
    </div>

    {sortedCategoryNames.map(categoryName => {
      const categoryData = groupedData[categoryName];
      return (
        <section id={categoryName} class="category-section">
          <h2 class="category-title">{categoryName}</h2>

          {/* 如果这个分类有子分类 */}
          {categoryData.hasSubcategories && (
            // 【核心修改】
            // 在渲染子分类之前，先对它们的名称进行排序
            Object.keys(categoryData.subcategories)
              .sort((a, b) => {
                const orderRules = subcategoryOrder[categoryName] || {};
                const orderA = orderRules[a] || 999;
                const orderB = orderRules[b] || 999;
                return orderA - orderB;
              })
              .map(subcatName => {
                const entries = categoryData.subcategories[subcatName];
                return (
                  <div id={`${categoryName}-${subcatName}`} class="subcategory-block">
                    <h3 class="subcategory-title">{subcatName}</h3>
                    <div class="nav-grid">
                      {entries.map(entry => (
                        <div class="nav-card-wrapper" data-entry-id={entry.id}>
                          <NavCard entry={entry} />
                        </div>
                      ))}
                    </div>
                  </div>
                )
              })
          )}

          {/* 如果这个分类有不带子分类的直属卡片 */}
          {categoryData.items.length > 0 && (
            <div class="nav-grid">
              {categoryData.items.map(entry => (
                <div class="nav-card-wrapper" data-entry-id={entry.id}>
                  <NavCard entry={entry} />
                </div>
              ))}
            </div>
          )}
        </section>
      )
    })}
  </div>
</AppLayout>

<script>
  window.addEventListener('search-results', (event) => {
    const { results } = event.detail;
    const allCards = document.querySelectorAll('.nav-card-wrapper');
    const allSections = document.querySelectorAll('.category-section');
    const allSubCategoryBlocks = document.querySelectorAll('.subcategory-block');

    // Case 1: 搜索框被清空，显示所有内容
    if (results === null) {
      allCards.forEach(card => (card.style.display = 'block'));
      allSections.forEach(section => (section.style.display = 'block'));
      allSubCategoryBlocks.forEach(block => (block.style.display = 'block'));
      return;
    }

    // Case 2: 有搜索结果
    const resultSet = new Set(results);
    const visibleSections = new Set();
    const visibleSubBlocks = new Set();

    allCards.forEach(card => {
      const cardId = card.dataset.entryId;
      
      if (resultSet.has(cardId)) {
        card.style.display = 'block';
        const section = card.closest('.category-section');
        const subBlock = card.closest('.subcategory-block');
        if (section) visibleSections.add(section);
        if (subBlock) visibleSubBlocks.add(subBlock);
      } else {
        card.style.display = 'none';
      }
    });

    // 隐藏那些没有任何可见卡片的分类和子分类区块
    allSections.forEach(section => {
      if (!visibleSections.has(section)) {
        section.style.display = 'none';
      } else {
        section.style.display = 'block';
      }
    });

    allSubCategoryBlocks.forEach(block => {
      if (!visibleSubBlocks.has(block)) {
        block.style.display = 'none';
      } else {
        block.style.display = 'block';
      }
    });
  });
</script>

<style>
  .page-container { padding: 2rem 3rem; }
  .category-section { margin-bottom: 3rem; }
  .category-title { font-size: 1.8rem; color: #333; margin-bottom: 1.5rem; font-weight: 600; }
  .nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.875rem; }
  .placeholder-group-top { display: flex; justify-content: flex-end; gap: 1rem; margin-bottom: 2rem; height: 40px; }
  .placeholder-item { width: 120px; background-color: #f0f0f0; border-radius: 8px; }
  .search-container { margin-bottom: 4rem; }
  .subcategory-block { margin-bottom: 2.5rem; }
  .subcategory-title { font-size: 1.2rem; color: #555; margin-bottom: 1rem; font-weight: 500; }
</style>